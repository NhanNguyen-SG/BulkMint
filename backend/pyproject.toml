[project]
name = "bulkmint-backend"
version = "0.1.0"
description = "FastAPI backend for BulkMint"
requires-python = ">=3.11,<3.15"
dependencies = [
    "fastapi>=0.128.8,<1.0",
    "openai>=2.38.0,<3.0",
    "pydantic>=2.13.4,<3.0",
    "python-dotenv>=1.2.1,<2.0",
    "python-multipart>=0.0.20,<1.0",
    "uvicorn[standard]>=0.39.0,<1.0",
]

[dependency-groups]
dev = [
    "mypy>=1.19.1,<2.0",
    "pytest>=9.0.2,<10.0",
    "ruff>=0.15.5,<1.0",
]

[tool.uv]
package = false

[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = [".venv", ".venv-validation"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.mypy]
python_version = "3.11"
check_untyped_defs = true
disallow_incomplete_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
exclude = ["^\\.venv/", "^\\.venv-validation/"]
